<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Giu Page: raccolta di pagine pubbliche da consultare e condividere.">
  <meta name="theme-color" content="#173e35">
  <title>Giu Page</title>
  <link rel="icon" href="./assets/gp-icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./assets/site.css?v=20260727-8">
</head>
<body>
  <header class="site-header">
    <div class="site-header__inner">
      <a class="brand" href="./" aria-label="Giu Page, pagina iniziale">
        <img class="brand__mark" src="./assets/gp-icon.svg" width="34" height="34" alt="">
        <span>Giu Page</span>
      </a>
      <div class="header-actions">
        <button class="icon-button" type="button" aria-label="Cerca nelle pagine" aria-expanded="false" aria-controls="home-search" data-search-toggle>
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"></circle><path d="m16 16 4 4"></path></svg>
        </button>
        <details class="menu">
          <summary class="icon-button" aria-label="Apri elenco delle pagine">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4.5h14M5 9.5h14M5 14.5h14M5 19.5h14"></path></svg>
          </summary>
          <nav class="menu__panel" id="page-menu" aria-label="Pagine disponibili"></nav>
        </details>
      </div>
    </div>
    <div class="home-search" id="home-search" hidden>
      <div class="home-search__inner">
        <label for="search">Cerca nelle pagine</label>
        <input id="search" type="search" placeholder="Titolo o argomento" autocomplete="off">
      </div>
    </div>
  </header>

  <main class="content">
    <p id="count" class="count" aria-live="polite"></p>
    <section id="catalog" class="catalog" aria-label="Pagine pubblicate"></section>
    <div id="empty" class="empty" hidden>
      <h1>Nessuna pagina pubblicata</h1>
      <p>Il catalogo si aggiornerà alla prima pubblicazione.</p>
    </div>
  </main>

  <template id="card-template">
    <article class="card">
      <a class="card__link">
        <div class="card__media" hidden><img alt=""></div>
        <div class="card__body">
          <p class="card__date"></p>
          <h2 class="card__title"></h2>
          <p class="card__description"></p>
        </div>
      </a>
      <button class="share" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="18" cy="5" r="2.5"></circle><circle cx="6" cy="12" r="2.5"></circle><circle cx="18" cy="19" r="2.5"></circle><path d="m8.2 10.8 7.6-4.5M8.2 13.2l7.6 4.5"></path></svg>
        <span>Condividi</span>
      </button>
    </article>
  </template>

  <script src="./assets/catalogo.js?v=20260727-8" defer></script>
</body>
</html>
