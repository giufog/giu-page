<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Giu Page: pagine organizzate per argomento.">
  <meta name="theme-color" content="#173e35">
  <title>Giu Page</title>
  <link rel="icon" href="./assets/gp-icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./assets/site.css?v=20260731-2">
  <link rel="stylesheet" href="./assets/app-shell.css?v=20260731-2">
</head>
<body>
  <header class="site-header">
    <div class="site-header__inner">
      <span class="brand" aria-label="Giu Page">
        <img class="brand__mark" src="./assets/gp-icon.svg" width="34" height="34" alt="">
        <span>Giu Page</span>
      </span>
      <div class="header-actions">
        <button class="icon-button" type="button" aria-label="Cerca" aria-expanded="false" aria-controls="home-search" data-search-toggle>
          <img src="https://api.iconify.design/lucide/search.svg?color=%23ffffff" alt="">
        </button>
        <span data-app-menu-slot></span>
      </div>
    </div>
    <div class="home-search" id="home-search" hidden>
      <div class="home-search__inner">
        <label for="search" data-search-label>Cerca titolo o argomento</label>
        <input id="search" type="search" placeholder="Scrivi per cercare" autocomplete="off">
      </div>
    </div>
  </header>

  <main class="content">
    <section data-home>
      <div class="intro">
        <h1>Argomenti</h1>
        <p>Una raccolta ordinata per trovare velocemente quello che serve.</p>
      </div>
      <div class="category-grid" data-category-grid aria-label="Argomenti disponibili"></div>
    </section>

    <section data-topic hidden>
      <button class="back-button" type="button" data-back>
        <img src="https://api.iconify.design/lucide/arrow-left.svg?color=%23173e35" alt="">
        Tutti gli argomenti
      </button>
      <div class="topic-heading">
        <div>
          <h1 data-topic-title></h1>
          <p data-topic-description></p>
        </div>
        <strong data-topic-count aria-live="polite"></strong>
      </div>
      <div class="page-grid" data-page-grid></div>
      <div class="empty" data-topic-empty hidden>
        <h2>Nessuna pagina trovata</h2>
        <p>Prova con un termine differente.</p>
      </div>
    </section>

    <div class="empty" data-catalog-empty hidden>
      <h1>Catalogo non disponibile</h1>
      <p>Riprova tra poco.</p>
    </div>
  </main>

  <div class="toast" hidden role="status" aria-live="polite"></div>
  <script src="./assets/catalogo.js?v=20260731-2" defer></script>
  <script src="./assets/app-shell.js?v=20260731-2" defer></script>
</body>
</html>
