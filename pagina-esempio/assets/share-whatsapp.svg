<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Standard grafico Giu Page</title>
  <desc id="description">Composizione verde salvia con monogramma GP e componenti grafici ordinati.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#173E35"/>
      <stop offset="1" stop-color="#4D8A70"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0D2C25" flood-opacity=".24"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#background)"/>
  <circle cx="1040" cy="90" r="210" fill="#9BE878" opacity=".10"/>
  <circle cx="105" cy="590" r="250" fill="#E5F0E8" opacity=".08"/>

  <g transform="translate(78 72)">
    <rect width="180" height="180" rx="45" fill="#E5F0E8"/>
    <g transform="translate(28 28)">
      <rect width="42" height="42" rx="9" fill="#4D8A70"/>
      <rect x="52" width="42" height="42" rx="9" fill="#9BE878"/>
      <rect y="52" width="42" height="42" rx="9" fill="#9BE878"/>
      <rect x="52" y="52" width="42" height="42" rx="9" fill="#4D8A70"/>
    </g>
    <text x="155" y="155" text-anchor="end" fill="#173E35" font-family="Arial, sans-serif" font-size="58" font-weight="800" letter-spacing="-5">GP</text>
  </g>

  <g transform="translate(330 86)" fill="#FFFFFF">
    <text x="0" y="66" font-family="Arial, sans-serif" font-size="60" font-weight="800" letter-spacing="-2">Standard grafico</text>
    <text x="0" y="126" font-family="Arial, sans-serif" font-size="60" font-weight="800" letter-spacing="-2">da provare</text>
    <text x="2" y="176" fill="#E5F0E8" font-family="Arial, sans-serif" font-size="25">Componenti semplici, leggibili e mobile-first</text>
  </g>

  <g transform="translate(78 310)" filter="url(#shadow)">
    <rect width="1044" height="240" rx="30" fill="#F1F6F1"/>
    <rect x="34" y="32" width="465" height="176" rx="20" fill="#FFFFFF" stroke="#D8E5DC" stroke-width="3"/>
    <rect x="64" y="64" width="238" height="22" rx="11" fill="#173E35"/>
    <rect x="64" y="103" width="374" height="13" rx="7" fill="#D8E5DC"/>
    <rect x="64" y="130" width="326" height="13" rx="7" fill="#D8E5DC"/>
    <rect x="64" y="166" width="128" height="25" rx="12" fill="#217A46"/>

    <rect x="527" y="32" width="483" height="176" rx="20" fill="#FFFFFF" stroke="#D8E5DC" stroke-width="3"/>
    <circle cx="570" cy="72" r="18" fill="#E5F0E8"/>
    <rect x="600" y="61" width="210" height="20" rx="10" fill="#173E35"/>
    <rect x="557" y="108" width="420" height="13" rx="7" fill="#D8E5DC"/>
    <rect x="557" y="137" width="360" height="13" rx="7" fill="#D8E5DC"/>
    <rect x="557" y="166" width="88" height="24" rx="12" fill="#9BE878"/>
    <rect x="658" y="166" width="112" height="24" rx="12" fill="#E5F0E8"/>
  </g>
</svg>

